# Render Blueprint for KAJAR. Deploy: Render Dashboard → New → Blueprint → pick this repo.
# Free plan: the SQLite file lives on an ephemeral disk, so every deploy or restart (including
# the free plan's sleep after ~15 idle minutes) starts again from fresh demo data.
# For data that survives restarts, see the "Persistent disk" note at the bottom.
services:
  - type: web
    name: kajar
    runtime: node
    plan: free
    region: singapore # closest Render region to Bengkulu (PRD 16: Southeast Asia)
    branch: main
    buildCommand: npm install --no-audit --no-fund
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      # Render terminates HTTPS in front of the app.
      - key: COOKIE_SECURE
        value: "1"
      - key: TRUST_PROXY
        value: "1"
      - key: DB_PATH
        value: data/kajar.db
      # Random password for the demo staff accounts; read it in Dashboard → Environment.
      - key: DEMO_STAFF_PASSWORD
        generateValue: true
      # One-click "Masuk cepat untuk juri" panel on the sign-in pages. Turn off for a real pilot.
      - key: DEMO_MODE
        value: "1"
      - key: LLM_PROVIDER
        value: mock
      - key: LLM_FALLBACK_PROVIDER
        value: mock
      # Only needed when LLM_PROVIDER=anthropic. Filled in by hand in the Dashboard, never in git.
      - key: LLM_MODEL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

# Persistent disk (paid plans only): change `plan: free` to `plan: starter`, set
# DB_PATH to /var/data/kajar.db, and add under the service:
#
#    disk:
#      name: kajar-data
#      mountPath: /var/data
#      sizeGB: 1
